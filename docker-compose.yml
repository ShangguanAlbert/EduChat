services:
  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-educhat}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.runCommand({ ping: 1 }).ok' | mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin 127.0.0.1:27017/test | grep 1",
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: educhat-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EDUCHAT_BASE_PATH: ${EDUCHAT_BASE_PATH:-/}
    image: educhat-app:latest
    container_name: educhat-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8787
      EDUCHAT_BASE_PATH: ${EDUCHAT_BASE_PATH:-/}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_me}@mongo:27017/${MONGO_DB_NAME:-educhat}?authSource=admin
      GROUP_CHAT_AI_REDIS_URL: redis://redis:6379
      PYTHON_RUNNER_URL: http://python-runner:8790
    networks:
      - default
      - python_runner_internal
    ports:
      - "3080:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  group-chat-ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EDUCHAT_BASE_PATH: ${EDUCHAT_BASE_PATH:-/}
    image: educhat-app:latest
    container_name: educhat-group-chat-ai-worker
    restart: unless-stopped
    command: ["node", "server/workers/group-chat-ai-worker.js"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8787
      EDUCHAT_BASE_PATH: ${EDUCHAT_BASE_PATH:-/}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_me}@mongo:27017/${MONGO_DB_NAME:-educhat}?authSource=admin
      GROUP_CHAT_AI_REDIS_URL: redis://redis:6379

  python-runner:
    build:
      context: ./python-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8790:8790"
    read_only: true
    tmpfs:
      - /tmp:size=1g,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${PYTHON_RUNNER_PIDS_LIMIT:-256}
    mem_limit: ${PYTHON_RUNNER_CONTAINER_MEMORY_LIMIT:-96g}
    environment:
      PYTHON_RUNNER_REDIS_URL: redis://redis:6379
      PYTHON_RUNNER_REDIS_REQUIRED: "true"
      PYTHON_RUNNER_REDIS_PREFIX: ${PYTHON_RUNNER_REDIS_PREFIX:-educhat:python-runner}
      PYTHON_RUNNER_MAX_CONCURRENCY: ${PYTHON_RUNNER_MAX_CONCURRENCY:-64}
      PYTHON_RUNNER_PROCESS_LIMIT: ${PYTHON_RUNNER_PROCESS_LIMIT:-80}
      PYTHON_RUNNER_GLOBAL_MAX_CONCURRENCY: ${PYTHON_RUNNER_GLOBAL_MAX_CONCURRENCY:-64}
      PYTHON_RUNNER_QUEUE_MAX_SIZE: ${PYTHON_RUNNER_QUEUE_MAX_SIZE:-512}
      PYTHON_RUNNER_MAX_QUEUE_WAIT_SECONDS: ${PYTHON_RUNNER_MAX_QUEUE_WAIT_SECONDS:-600}
      PYTHON_RUNNER_MEMORY_BYTES: ${PYTHON_RUNNER_MEMORY_BYTES:-1073741824}
    networks:
      - default
      - python_runner_internal

volumes:
  mongo_data:
  redis_data:

networks:
  python_runner_internal:
    internal: true
